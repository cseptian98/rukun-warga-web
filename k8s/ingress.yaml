apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rukun-warga-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
    - http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: rukun-warga-api-service
                port:
                  number: 80
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: rukun-warga-web-service
                port:
                  number: 80
